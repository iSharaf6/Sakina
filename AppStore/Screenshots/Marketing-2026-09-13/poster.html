<body><main id="poster"></main><script>
const i=Number(new URLSearchParams(location.search).get('id')||1);
const root='../../..'; const raw='../en-AU/';const icon=root+'/Design/HaneenBrand/AppIcon-SimpleCompanion.png';
const slides=[
{theme:'cover',tag:'YOUR DAILY COMPANION',title:'A little closer,<br><em>every day.</em>',sub:'Qur’an, du’a and prayer.<br>All in one gentle place.',src:'01-home.png'},
{theme:'quran',tag:'QUR’AN',title:'Keep the<br><em>Qur’an close.</em>',sub:'Read, listen and return to your place.',src:'02-quran.png'},
{theme:'feelings',tag:'FEELINGS',title:'Find words for<br><em>how you feel.</em>',sub:'Discover du’as for the moment you’re in.',src:'07-all-feelings.png'},
{theme:'dhikr',tag:'DAILY DHIKR',title:'Little moments.<br><em>Daily dhikr.</em>',sub:'Arabic, meanings and sourced rewards.',src:'04-morning-adhkar-dark.png'},
{theme:'prayer',tag:'PRAYER TIMES',title:'Make room<br><em>for prayer.</em>',sub:'Your next prayer, and the day ahead.',src:'05-prayer-times.png'},
{theme:'widgets',tag:'WIDGETS',title:'A little faith.<br><em>Right at home.</em>',sub:'Prayer, Qur’an and dhikr at a glance.'}
];
const s=slides[i-1];const p=document.querySelector('#poster');p.className=s.theme;
p.innerHTML=`<div class="disc"></div><div class="brand"><img src="${icon}" alt="">Haneen</div><div class="eyebrow">${s.tag}</div><div class="copy"><h1>${s.title}</h1><p class="sub">${s.sub}</p></div>`;
if(s.src)p.innerHTML+=`<div class="phone"><img src="${raw+s.src}" alt="Actual Haneen ${s.tag.toLowerCase()} screen"></div>`;
if(i===1)p.innerHTML+='<img class="companion" src="assets/peek-companion.png" alt="">';
if(i===5)p.innerHTML+=`<img class="small-art" src="${root}/Shared/CompanionAssets.xcassets/Companion-morning.imageset/artwork.png" alt="">`;
if(i===6){for(const cls of ['widget-medium','widget-small widget-reading','widget-small widget-countdown'])p.innerHTML+=`<div class="widget-card ${cls}"><img src="${raw}06-widget-collection.png" alt="Haneen widget preview"></div>`;p.innerHTML+=`<div class="widget-caption">Small reminders. A familiar face.<span>Made for your Home Screen.</span></div><div class="leaf"></div><div class="widget-signoff"><img src="${icon}" alt="">A little closer, every day.</div>`;}
</script></body></html>
