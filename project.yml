name: Sakina
options:
  bundleIdPrefix: com.islamsharaf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Sakina:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islamsharaf.sakina
    sources:
      - Sakina
      - Shared
    entitlements:
      path: Sakina/Sakina.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.islamsharaf.sakina
    info:
      path: Sakina/Info.plist
      properties:
        CFBundleDisplayName: Sakina
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon76x76
        CFBundleURLTypes:
          - CFBundleURLName: com.islamsharaf.sakina
            CFBundleURLSchemes:
              - sakina
        UIAppFonts:
          - UthmanicHafs.ttf
    dependencies:
      - target: SakinaWidget
        embed: true

  SakinaWidget:
    type: app-extension
    platform: iOS
    sources:
      - SakinaWidget
      - Shared
    entitlements:
      path: SakinaWidget/SakinaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.islamsharaf.sakina
    info:
      path: SakinaWidget/Info.plist
      properties:
        CFBundleDisplayName: Sakina
        UIAppFonts:
          - UthmanicHafs.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islamsharaf.sakina.widget
        SKIP_INSTALL: true
