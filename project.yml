name: Sakina
options:
  bundleIdPrefix: com.islamsharaf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: U9Z36KR28N
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: "1"
    YAQEEN_SCHOLAR_SUPABASE_URL: ""
    YAQEEN_SCHOLAR_SUPABASE_PUBLISHABLE_KEY: ""

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    from: 1.5.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.46.0

targets:
  Sakina:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islamsharaf.sakina
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Sakina
      - Shared
    entitlements:
      path: Sakina/Sakina.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.islamsharaf.sakina
    info:
      path: Sakina/Info.plist
      properties:
        CFBundleDisplayName: Yaqeen
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Yaqeen uses your approximate location to calculate local prayer times and the Qibla direction. Your coordinates stay on this device.
        YaqeenScholarSupabaseURL: $(YAQEEN_SCHOLAR_SUPABASE_URL)
        YaqeenScholarSupabasePublishableKey: $(YAQEEN_SCHOLAR_SUPABASE_PUBLISHABLE_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.islamsharaf.yaqeen
            CFBundleURLSchemes:
              - sakina
              - yaqeen
        UIAppFonts:
          - UthmanicHafs.ttf
          - HafsSmart.ttf
          - IndoPak.ttf
    dependencies:
      - target: SakinaWidget
        embed: true
      - package: Adhan
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: Supabase
        product: Supabase

  SakinaWidget:
    type: app-extension
    platform: iOS
    sources:
      - SakinaWidget
      - path: Shared
        excludes:
          - ArabicReflections.swift
          - CompanionContent.swift
          - GuidanceCatalog.swift
          - Localization.swift
    entitlements:
      path: SakinaWidget/SakinaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.islamsharaf.sakina
    info:
      path: SakinaWidget/Info.plist
      properties:
        CFBundleDisplayName: Yaqeen
        UIAppFonts:
          - UthmanicHafs.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islamsharaf.sakina.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  SakinaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SakinaTests
    dependencies:
      - target: Sakina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islamsharaf.sakina.tests
        GENERATE_INFOPLIST_FILE: YES
